name: Verify Human Identity

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'ronggo1308'
        required: true
        default: 'ronggo1308'
      agent_description:
        description: 'ronggo1308'
        required: true
        default: 'ronggo1308 AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install ClawHub
        run: npx clawhub@latest install verified-agent-identity

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Create Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Link Human to Agent
        run: |
          node scripts/manualLinkHumanToAgent.js --challenge '{"name":"ronggo1308","description":"ronggo1308 AI Agent"}'
